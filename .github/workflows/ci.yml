name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run ruff check .
      - run: uv run ty check
      - name: Scan this repo with its own rules (no model in CI)
        run: uv run smart-commit-guard scan --no-model --files $(git ls-files)

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run pytest -q

  install-smoke:
    name: clean install of the built wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - name: Install the wheel into an empty venv and run the CLI away from the checkout
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          printf 'x = 1\n' > ok.py
          "$RUNNER_TEMP/venv/bin/smart-commit-guard" --help > /dev/null
          "$RUNNER_TEMP/venv/bin/smart-commit-guard" scan --no-model --files ok.py
          printf 'KEY=1\n' > .env
          if "$RUNNER_TEMP/venv/bin/smart-commit-guard" scan --no-model --files .env; then echo "expected a block"; exit 1; fi
