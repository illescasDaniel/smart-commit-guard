name: Release
# Manual on purpose: run it (Actions -> Release -> Run workflow, with the tag, e.g. v0.1.0) after the PyPI trusted
# publisher exists for this repo and the GitHub environment "pypi" is set up.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@v10.2.0
      - name: The tag must match the package version
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${{ inputs.tag }}" || { echo "tag ${{ inputs.tag }} != version $v"; exit 1; }
      - run: uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
