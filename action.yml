name: smart-commit-guard
description: Scan a repository or a pull request for committed secrets (rules, plus an optional decision model)
branding:
  icon: shield
  color: gray-dark
inputs:
  args:
    description: Arguments for smart-commit-guard, for example `scan --no-model --all` or `scan --no-model --diff origin/main...HEAD --config-from origin/main`
    default: scan --no-model --all
  version:
    description: PyPI version specifier for smart-commit-guard
    default: ">=0.2,<0.3"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
    - name: Run smart-commit-guard
      shell: bash
      env:
        SCG_ARGS: ${{ inputs.args }}
        SCG_VERSION: ${{ inputs.version }}
      # inputs go through the environment, never into the script text, so they cannot inject shell commands
      run: uvx --from "smart-commit-guard${SCG_VERSION}" smart-commit-guard $SCG_ARGS
