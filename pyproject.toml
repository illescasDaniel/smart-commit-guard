[project]
name = "smart-commit-guard"
version = "0.2.0"
description = "Pre-commit and CI secret gate: deterministic rules plus a small decision model for ambiguous cases"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Illescas Romero", email = "illescas.daniel@protonmail.com" }]
keywords = ["secrets", "pre-commit", "git-hook", "security", "llm"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Environment :: Console",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Security",
	"Topic :: Software Development :: Version Control :: Git",
	"Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/illescasDaniel/smart-commit-guard"
Issues = "https://github.com/illescasDaniel/smart-commit-guard/issues"

[project.scripts]
smart-commit-guard = "smart_commit_guard.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.15", "ty>=0.0.1", "taskipy>=1.14.1", "hypothesis>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
indent-width = 4
[tool.ruff.format]
indent-style = "tab"

[tool.taskipy.tasks]
test = { cmd = "pytest -q", help = "unit tests (no model, no network)" }
setup-hooks = { cmd = "uv run smart-commit-guard install-hook --shared --force", help = "enable the shared pre-commit hook in this clone" }
